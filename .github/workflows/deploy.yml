name: Deploy to VPS

on:
  push:
    branches:
      - main # Akan berjalan setiap kali ada push ke branch main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        # Menggunakan npm install karena package-lock.json tersedia
        run: npm install

      - name: Build Astro Project
        run: npm run build

      - name: Setup SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.VPS_SSH_KEY }}
          known_hosts: 'placeholder'

      - name: Add VPS to Known Hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS via Rsync
        # --delete akan menghapus file di VPS yang sudah tidak ada di hasil build terbaru
        run: rsync -avz --delete ./dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/web/nusabuild/dist/

      - name: Post-Deploy (Permissions & Nginx Reload)
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            # Set ownership ke www-data dan pastikan file statis bisa dibaca oleh Nginx
            chown -R www-data:www-data /opt/web/nusabuild/dist &&
            find /opt/web/nusabuild/dist -type d -exec chmod 755 {} \; &&
            find /opt/web/nusabuild/dist -type f -exec chmod 644 {} \; &&
            
            # Reload konfigurasi Nginx di dalam container tanpa downtime
            # CATATAN: Ubah 'nginx' dengan nama container Nginx Anda (misal: 'nginx-proxy' atau 'nusabuild-nginx-1')
            docker exec nginx nginx -s reload
          "
